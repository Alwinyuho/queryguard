[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queryguard"
version = "0.1.0"
description = "Text-to-SQL agent with read-only sandboxing, self-repair and a BIRD evaluation suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "sqlglot>=25",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ml = [
    "torch>=2.6",
    "transformers>=4.56",
    "accelerate>=1.0",
    "bitsandbytes>=0.46",
    "sentence-transformers>=5.0",
]
ui = ["gradio>=5.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
